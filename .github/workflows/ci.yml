name: Erlgame CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    name: Running Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Compile
        run: rebar3 compile

      - name: Run tests
        run: rebar3 ct

  relup-guard-erlang:
    name: Verify the hot upgrade from main actually applies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: deployex/relup-guard-erlang@v1
        env:
          # config/vm.args uses ${RELEASE_NODE}/${RELEASE_COOKIE}/
          # ${RELEASE_SSL_OPTIONS} placeholders that deployex fills in at
          # deploy time; nothing here does that, so without
          # RELX_REPLACE_OS_VARS=true the boot script passes the literal
          # "${RELEASE_SSL_OPTIONS}" text to erl and the release fails to
          # boot. The node name/cookie values themselves don't matter -
          # relup-guard-erlang overwrites those two vm.args lines itself
          # once the release is extracted.
          RELX_REPLACE_OS_VARS: "true"
          RELEASE_NODE: erlgame
          RELEASE_COOKIE: ci-relup-guard
          RELEASE_SSL_OPTIONS: ""
          # erlgame_app:start/2 does list_to_integer(os:getenv("PORT"))
          # unconditionally - with PORT unset, os:getenv/1 returns `false`
          # and that call crashes outright, which this action can only
          # ever report as a generic boot timeout.
          PORT: "4000"
        with:
          old-ref: ${{ github.event.pull_request.base.sha }}
          release-name: erlgame
